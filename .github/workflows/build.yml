name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build src/ModernMenuManager/ModernMenuManager.csproj -c Release -p:Version=0.1.${{ github.run_number }}

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ModernMenuManager
          path: src/ModernMenuManager/bin/Release/ModernMenuManager.exe

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v0.1.${{ github.run_number }}"
          gh release create $tag src/ModernMenuManager/bin/Release/ModernMenuManager.exe `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" `
            --title "ModernMenuManager $tag" `
            --notes "下載 ModernMenuManager.exe 直接執行即可（不用安裝）。分支：${{ github.ref_name }}"
